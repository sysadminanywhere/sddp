spring:
  profiles:
    default: docker
  application:
    name: sddp-core-backend
  datasource:
    url: ${SddP_DB_URL:jdbc:postgresql://localhost:5432/sddp}
    username: ${SddP_DB_USERNAME:sddp}
    password: ${SddP_DB_PASSWORD:sddp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
