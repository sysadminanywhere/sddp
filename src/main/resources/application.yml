spring:
  profiles:
    default: docker
  application:
    name: sddp-core-backend
  datasource:
    url: ${SddP_DB_URL:jdbc:postgresql://localhost:5432/sddp}
    username: ${SddP_DB_USERNAME:sddp}
    password: ${SddP_DB_PASSWORD:sddp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.type.json_format_mapper: ru.sddp.platform.config.Jackson3JsonFormatMapper
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
sddp:
  audit:
    retention-days: ${SDDP_AUDIT_RETENTION_DAYS:90}
  security:
    oidc:
      enabled: ${SDDP_OIDC_ENABLED:false}
      issuer-uri: ${SDDP_OIDC_ISSUER_URI:}
