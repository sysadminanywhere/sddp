services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sddp
      POSTGRES_USER: sddp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong unique password}
    volumes:
      - sddp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sddp -d sddp"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sddp-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-sddp}:${IMAGE_TAG:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SddP_DB_URL: jdbc:postgresql://postgres:5432/sddp
      SddP_DB_USERNAME: sddp
      SddP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong unique password}
      SDDP_OIDC_ENABLED: ${SDDP_OIDC_ENABLED:-false}
      SDDP_OIDC_ISSUER_URI: ${SDDP_OIDC_ISSUER_URI:-}
      SDDP_AUDIT_RETENTION_DAYS: ${SDDP_AUDIT_RETENTION_DAYS:-90}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sddp-net
    restart: unless-stopped

volumes:
  sddp-postgres:

networks:
  sddp-net:
    driver: bridge
