version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sddp
      POSTGRES_USER: sddp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sddp}
    volumes:
      - sddp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sddp -d sddp"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sddp-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-ghcr.io/${GITHUB_REPOSITORY}}:latest
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SddP_DB_URL: jdbc:postgresql://postgres:5432/sddp
      SddP_DB_USERNAME: sddp
      SddP_DB_PASSWORD: ${POSTGRES_PASSWORD:-sddp}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sddp-net
    restart: unless-stopped

volumes:
  sddp-postgres:

networks:
  sddp-net:
    driver: bridge