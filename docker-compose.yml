services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sddp
      POSTGRES_USER: sddp
      POSTGRES_PASSWORD: sddp
    ports:
      - "5432:5432"
    volumes:
      - sddp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sddp -d sddp"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sddp-postgres:
