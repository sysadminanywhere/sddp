name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY_DOCKERHUB: docker.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sddp
          POSTGRES_USER: sddp
          POSTGRES_PASSWORD: sddp
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sddp -d sddp"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend dependencies and build
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run build
          git diff --exit-code -- ../src/main/resources/static/flow/graph.js ../src/main/resources/static/flow/graph.css

      - name: Validate Kubernetes manifest schema without a cluster
        run: docker run --rm -v "${{ github.workspace }}:/work" -w /work ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary deploy/kubernetes.yaml

      - name: Extract Maven version
        id: maven-version
        run: |
          VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Strip -SNAPSHOT for tagging
          CLEAN_VERSION=${VERSION%-SNAPSHOT}
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Verify release tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PROJECT_VERSION: ${{ steps.maven-version.outputs.version }}
        run: |
          [[ "$PROJECT_VERSION" != *-SNAPSHOT ]] || { echo 'Release versions cannot be snapshots'; exit 1; }
          [[ "${GITHUB_REF_NAME#v}" == "$PROJECT_VERSION" ]] || { echo 'Release tag must match pom.xml version'; exit 1; }

      - name: Build and test with Maven
        run: mvn -B verify
        env:
          SddP_DB_URL: jdbc:postgresql://localhost:5432/sddp
          SddP_DB_USERNAME: sddp
          SddP_DB_PASSWORD: sddp

      - name: Verify snapshots and the OpenAPI pilot against PostgreSQL
        run: mvn -B -Dtest=SnapshotPostgresIntegrationTest test
        env:
          SDDP_POSTGRES_IT: "true"
          SddP_DB_URL: jdbc:postgresql://localhost:5432/sddp
          SddP_DB_USERNAME: sddp
          SddP_DB_PASSWORD: sddp

      - name: Verify HTTPS gateway authentication and Origin checks
        run: bash scripts/test-gateway.sh

      - name: Verify production Compose and database recovery
        run: bash scripts/test-compose-recovery.sh
        env:
          SDDP_TEST_BROWSER: "1"

      - name: Verify upgrade and rollback against the previous revision
        run: bash scripts/test-upgrade-rollback.sh
        env:
          SDDP_UPGRADE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}

      - name: Verify isolated installation and offline Java build
        run: bash scripts/test-airgap-install.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  docker:
    needs: [test, docker-plugin-test, kubernetes-plugin-test, security]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Maven version
        id: maven-version
        run: |
          VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          CLEAN_VERSION=${VERSION%-SNAPSHOT}
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Determine tags
        id: tags
        run: |
          SHA=$(git rev-parse --short HEAD)
          VERSION=${{ steps.maven-version.outputs.clean_version }}
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          REGS=()
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            REGS+=("${REGISTRY_DOCKERHUB}/${IMAGE_NAME}")
          fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Tag push: v1.2.3 -> tag as 1.2.3, also major.minor
            TAG_VERSION=${GITHUB_REF_NAME#v}
            MAJOR_MINOR=$(echo $TAG_VERSION | cut -d. -f1,2)
            VERSIONS=("$TAG_VERSION" "$MAJOR_MINOR" latest)
          else
            # Main builds publish a commit-specific image. Release tags own the version and latest.
            VERSIONS=("${VERSION}-${SHA}")
          fi
          {
            echo 'tags<<EOF'
            for registry in "${REGS[@]}"; do
              for version in "${VERSIONS[@]}"; do echo "${registry}:${version}"; done
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: publish
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.maven-version.outputs.clean_version }}
          build-args: |
            VERSION=${{ steps.maven-version.outputs.clean_version }}
            GITHUB_REPOSITORY=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image against PostgreSQL
        if: startsWith(github.ref, 'refs/tags/v') && steps.publish.outcome == 'success'
        env:
          SDDP_TEST_BROWSER: "1"
          SDDP_TEST_PUBLISHED_IMAGE: docker.io/${{ github.repository }}
          SDDP_TEST_PUBLISHED_REVISION: ${{ github.sha }}
          IMAGE_TAG: ${{ steps.maven-version.outputs.clean_version }}
        run: bash scripts/test-compose-recovery.sh

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate resolved Maven SBOM including test dependencies
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom -DincludeTestScope=true -Dcyclonedx.skipAttach=true
      - name: Scan Maven dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: sbom
          scan-ref: target/bom.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Build image for security scan
        run: docker build -t sddp-security-scan:local .
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sddp-security-scan:local
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

  kubernetes-plugin-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: sddp-test
      - name: Build and load plugin fixture
        run: |
          docker build --network=none -t sddp-plugin-fixture:local ./src/test/resources/docker-plugin
          kind load docker-image sddp-plugin-fixture:local --name sddp-test
      - name: Run Kubernetes plugin integration test
        env:
          SDDP_K8S_IT: 'true'
        run: mvn -B -Dtest=KubernetesPluginIntegrationTest test

      - name: Verify deployed application and ServiceAccount against a real cluster
        run: |
          docker build -t sddp-kubernetes-test:local .
          kind load docker-image sddp-kubernetes-test:local --name sddp-test
          bash scripts/test-kubernetes-release.sh

  docker-plugin-test:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin fixture image
        run: |
          docker build --network=none -t sddp-plugin-fixture:local ./src/test/resources/docker-plugin

      - name: Run Docker plugin integration test
        env:
          SDDP_DOCKER_IT: "true"
          SddP_DB_URL: jdbc:postgresql://localhost:5432/sddp
          SddP_DB_USERNAME: sddp
          SddP_DB_PASSWORD: sddp
        run: mvn -B -Dtest=DockerPluginIntegrationTest test
